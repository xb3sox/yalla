<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yalla - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #14736A 0%, #0B3A35 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      text-align: center;
      color: white;
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .icon svg {
      width: 60px;
      height: 60px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .button {
      display: inline-block;
      padding: 12px 30px;
      background: white;
      color: #14736A;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .button:active {
      transform: translateY(0);
    }

    .tips {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .tips h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .tips ul {
      list-style: none;
      text-align: left;
    }

    .tips li {
      padding: 8px 0;
      padding-left: 25px;
      position: relative;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .tips li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #F59E0B;
      font-weight: bold;
    }

    [dir="rtl"] .tips li {
      padding-left: 0;
      padding-right: 25px;
      text-align: right;
    }

    [dir="rtl"] .tips li:before {
      left: auto;
      right: 0;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }

      .icon {
        width: 100px;
        height: 100px;
      }

      .icon svg {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p>It seems you've lost your internet connection. Don't worry, you can still access some features!</p>

    <button class="button" onclick="window.location.reload()">Try Again</button>

    <div class="tips">
      <h2>What you can do:</h2>
      <ul>
        <li>View previously loaded experiences</li>
        <li>Check your saved favorites</li>
        <li>Review your booking history</li>
        <li>Check your connection and try again</li>
      </ul>
    </div>
  </div>

  <script>
    // Detect language and update content
    const lang = navigator.language || navigator.userLanguage;
    if (lang.startsWith('ar')) {
      document.documentElement.dir = 'rtl';
      document.documentElement.lang = 'ar';
      document.querySelector('h1').textContent = 'أنت غير متصل';
      document.querySelector('p').textContent = 'يبدو أنك فقدت اتصالك بالإنترنت. لا تقلق، لا يزال بإمكانك الوصول إلى بعض الميزات!';
      document.querySelector('.button').textContent = 'حاول مرة أخرى';
      document.querySelector('.tips h2').textContent = 'ما يمكنك فعله:';
      const tips = document.querySelectorAll('.tips li');
      tips[0].textContent = 'عرض التجارب المحملة مسبقاً';
      tips[1].textContent = 'التحقق من مفضلاتك المحفوظة';
      tips[2].textContent = 'مراجعة سجل حجوزاتك';
      tips[3].textContent = 'التحقق من اتصالك والمحاولة مرة أخرى';
    }

    // Check if online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
