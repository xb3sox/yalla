<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#14736A"/>
  
  <!-- Letter Y -->
  <path d="M 30 25 L 50 50 L 70 25" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Vertical Line -->
  <line x1="50" y1="50" x2="50" y2="75" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round"/>
  
  <!-- Decorative Dots -->
  <circle cx="25" cy="50" r="3" fill="#F59E0B"/>
  <circle cx="75" cy="50" r="3" fill="#F59E0B"/>
  <circle cx="50" cy="85" r="3" fill="#F59E0B"/>
</svg>
