services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: yalla-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # dev only; set a real password outside local dev
      POSTGRES_DB: ${POSTGRES_DB:-yalla}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yalla-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: yalla-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yalla-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Dev command below (tsx watch) needs devDependencies, which only the
      # builder stage installs; the production stage omits them.
      target: builder
    container_name: yalla-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yalla
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: yalla
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test_dummy}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    networks:
      - yalla-network
    command: npm run dev

  # Frontend (Root React + Vite App)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yalla-frontend
    environment:
      PORT: 5173
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - yalla-network
    command: npm run dev

  # Adminer (Database Management UI)
  adminer:
    image: adminer:5
    container_name: yalla-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - yalla-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  yalla-network:
    driver: bridge
