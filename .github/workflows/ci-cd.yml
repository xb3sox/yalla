name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Frontend Tests and Build
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # Backend Tests and Build
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yalla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yalla_test
          NODE_ENV: test
        run: npm run migrate

      - name: Run backend typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Run backend test typecheck
        working-directory: ./backend
        run: npm run typecheck:tests

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yalla_test
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          SESSION_SECRET: test-session-secret
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_test_dummy
        run: |
          set -o pipefail
          npm run test:coverage -- --runInBand 2>&1 | tee /tmp/jest-backend.log || {
            # Surface failing suites/tests as check annotations (visible via API)
            sed -r 's/\x1b\[[0-9;]*m//g' /tmp/jest-backend.log \
              | grep -E '^(FAIL|  ● .*›)' | head -10 \
              | while IFS= read -r line; do echo "::error ::$line"; done
            exit 1
          }

      - name: Upload backend coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 7

  # Code Quality Checks (runs in parallel)
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Lint Markdown
        run: npm run lint:md

      - name: Run AI-native SDLC evals
        run: node evals/check.js

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Run ESLint on backend
        working-directory: ./backend
        run: npm run lint

  # Security Scan (runs in parallel)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: "Run npm audit on frontend (blocking: production deps, high+)"
        run: npm audit --omit=dev --audit-level=high

      - name: "Run npm audit on backend (blocking: production deps, high+)"
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

  # Build Summary
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [frontend, backend, code-quality, security]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download frontend build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build
          path: frontend-dist/
        continue-on-error: true

      - name: Download backend build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-build
          path: backend-dist/
        continue-on-error: true

      - name: Check build status
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests & Build | $FRONTEND_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests & Build | $BACKEND_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | $CODE_QUALITY_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | $SECURITY_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FRONTEND_RESULT" != "success" ] || [ "$BACKEND_RESULT" != "success" ] || [ "$CODE_QUALITY_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ]; then
            echo "❌ Pipeline failed: one or more required jobs did not succeed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ All required checks passed." >> $GITHUB_STEP_SUMMARY
