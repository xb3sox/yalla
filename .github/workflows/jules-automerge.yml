name: Jules PR Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: jules-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Verify & Queue Auto-Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Inspect PR Details & Author
        id: pr-check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "PR #$PR_NUMBER by $AUTHOR on branch $HEAD_BRANCH"
          
          IS_JULES=false
          
          # Case 1: Created by Google Jules bot account or automation bot
          if [[ "$AUTHOR" =~ ^(google-jules\[bot\]|jules\[bot\]|google-labs-jules\[bot\]|github-actions\[bot\])$ ]]; then
            IS_JULES=true
          fi
          
          # Case 2: Branch starts with jules/ or contains jules task signature
          if [[ "$HEAD_BRANCH" =~ ^jules/ ]] || [[ "$HEAD_BRANCH" =~ ^jules- ]]; then
            IS_JULES=true
          fi
          
          # Case 3: Official Jules task signature in PR body
          if echo "$PR_BODY" | grep -q "PR created automatically by Jules"; then
            IS_JULES=true
          fi
          
          if [ "$IS_JULES" = true ]; then
            echo "automerge_eligible=true" >> $GITHUB_OUTPUT
            echo "Eligible Jules PR detected."
          else
            echo "automerge_eligible=false" >> $GITHUB_OUTPUT
            echo "Not an eligible Jules PR (author: $AUTHOR, branch: $HEAD_BRANCH). Skipping."
          fi

      - name: Comprehensive File Safety Guardrail
        if: steps.pr-check.outputs.automerge_eligible == 'true'
        run: |
          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only)
          echo "Changed files in PR #$PR_NUMBER:"
          echo "$CHANGED_FILES"
          
          BLOCKED=false
          BLOCKED_FILES=""
          
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [[ "$file" =~ ^\.github/ ]] || \
               [[ "$file" =~ (^|/)\.env ]] || \
               [[ "$file" =~ ^AGENTS\.md$ ]] || \
               [[ "$file" =~ ^CLAUDE\.md$ ]] || \
               [[ "$file" =~ ^\.jules/ ]] || \
               [[ "$file" =~ ^evals/ ]] || \
               [[ "$file" =~ ^scripts/ ]] || \
               [[ "$file" =~ (^|/)Dockerfile.*$ ]] || \
               [[ "$file" =~ (^|/)docker-compose\.ya?ml$ ]] || \
               [[ "$file" =~ (^|/)package(-lock)?\.json$ ]] || \
               [[ "$file" =~ (^|/)pnpm-lock\.yaml$ ]] || \
               [[ "$file" =~ (^|/)yarn\.lock$ ]] || \
               [[ "$file" =~ (^|/)bun\.lockb$ ]] || \
               [[ "$file" =~ (^|/)tsconfig(\..*)?\.json$ ]] || \
               [[ "$file" =~ (^|/)vite\.config\.[jt]s$ ]]; then
              BLOCKED=true
              BLOCKED_FILES="${BLOCKED_FILES}"$'\n'"- ${file}"
            fi
          done <<< "$CHANGED_FILES"
          
          if [ "$BLOCKED" = true ]; then
            echo "Sensitive files modified:${BLOCKED_FILES}"
            COMMENT_BODY="⚠️ **Auto-merge halted:** Jules PR modifies sensitive workflow, rule, or build configuration files:${BLOCKED_FILES}"$'\n\n'"Manual review required."
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
            exit 1
          fi
          echo "Safety scan passed. No sensitive files touched."

      - name: Approve and Enable Native Auto-Merge
        if: steps.pr-check.outputs.automerge_eligible == 'true'
        run: |
          if ! gh pr review "$PR_NUMBER" --approve --body "✅ **Automated Review:** Safety checks passed. Queued for auto-merge upon successful CI completion." 2>&1; then
            echo "::notice ::Approval review could not be recorded (self-authored PR or repo setting disabled Actions review approvals)."
          fi

          if ! gh pr merge "$PR_NUMBER" --auto --squash --delete-branch; then
            echo "::warning ::'Allow auto-merge' is not toggled in GitHub Repository Settings. Please enable it in Settings > General > Pull Requests."
          else
            echo "Native auto-merge enabled for PR #$PR_NUMBER"
          fi
