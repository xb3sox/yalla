name: Agent Evals

on:
  push:
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.jules/**'
      - 'evals/**'
      - 'intent/**'
      - 'specs/**'
      - 'plans/**'
  # schedule: disabled to conserve private repo minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    name: Run Continuous Agent Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run Architecture & Agent Evals
        run: node evals/check.js
