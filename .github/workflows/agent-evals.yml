name: Agent Evals

on:
  push:
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.jules/**'
      - 'evals/**'
      - 'intent/**'
      - 'specs/**'
      - 'plans/**'
  # schedule: disabled to conserve private repo minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    name: Run Continuous Agent Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run Architecture & Agent Evals
        run: node evals/check.js
