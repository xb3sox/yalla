name: Bug Report
description: Report an issue, broken flow, security breach, or regression
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "p0-critical (Production blocker or security flaw)"
        - "p1-high (Major feature failure)"
        - "p2-medium (Non-blocking bug)"
        - "p3-low (Cosmetic or minor issue)"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      placeholder: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Navigate to '...'
        2. Click on '....'
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Logs
      description: OS, browser version, API endpoints, stack trace.
    validations:
      required: false
